<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 810" width="520" height="810" role="img" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title>從公開權重還原晶片排列的流程</title><desc>已公開的權重分成沒被訓練動過的列與訓練過的權重兩類；用一部分權重搜尋種子與執行緒數，再拿同一組答案預測沒參與搜尋的權重，對得上才算數。</desc><rect width="520" height="810" fill="#f4f6f3"/><rect x="40.0" y="20" width="440" height="54.0" rx="10" fill="#e3f0ef" stroke="#0f6b6b" stroke-width="1.5"/>
<text x="260" y="60" font-size="26" text-anchor="middle" fill="#12252b" font-weight="700">已公開的模型權重</text>
<rect x="10" y="118.0" width="500" height="269.0" rx="14" fill="none" stroke="#c9d1cc" stroke-width="1" stroke-dasharray="6 5"/>
<rect x="40" y="132.0" width="440" height="93.0" rx="10" fill="#ffffff" stroke="#8a8173" stroke-width="1.5"/>
<text x="260" y="172" font-size="26" text-anchor="middle" fill="#12252b" font-weight="400">沒被訓練動過的列</text>
<text x="260" y="211" font-size="26" text-anchor="middle" fill="#12252b" font-weight="400">初始值幾乎原樣保留</text>
<rect x="40" y="241.0" width="440" height="132.0" rx="10" fill="#ffffff" stroke="#b8651b" stroke-width="1.5"/>
<text x="260" y="281" font-size="26" text-anchor="middle" fill="#12252b" font-weight="400">訓練過的權重</text>
<text x="260" y="320" font-size="26" text-anchor="middle" fill="#12252b" font-weight="400">初始值加上調整量，</text>
<text x="260" y="359" font-size="26" text-anchor="middle" fill="#12252b" font-weight="400">起點高的最終仍略高</text>
<line x1="260.0" y1="74.0" x2="260.0" y2="110.0" stroke="#4b5e62" stroke-width="2" stroke-linecap="butt"/>
<polygon points="260.0,118.0 253.0,106.0 267.0,106.0" fill="#4b5e62"/>
<line x1="260.0" y1="387.0" x2="260.0" y2="423.0" stroke="#4b5e62" stroke-width="2" stroke-linecap="butt"/>
<polygon points="260.0,431.0 253.0,419.0 267.0,419.0" fill="#4b5e62"/>
<rect x="40.0" y="431.0" width="440" height="93.0" rx="10" fill="#e3f0ef" stroke="#0f6b6b" stroke-width="1.5"/>
<text x="260" y="471" font-size="26" text-anchor="middle" fill="#12252b" font-weight="400">用一部分權重</text>
<text x="260" y="510" font-size="26" text-anchor="middle" fill="#12252b" font-weight="400">搜尋種子與執行緒數</text>
<line x1="260.0" y1="524.0" x2="260.0" y2="556.0" stroke="#4b5e62" stroke-width="2" stroke-linecap="butt"/>
<polygon points="260.0,564.0 253.0,552.0 267.0,552.0" fill="#4b5e62"/>
<rect x="40.0" y="564.0" width="440" height="93.0" rx="10" fill="#e3f0ef" stroke="#0f6b6b" stroke-width="1.5"/>
<text x="260" y="604" font-size="26" text-anchor="middle" fill="#12252b" font-weight="400">把同一組答案</text>
<text x="260" y="643" font-size="26" text-anchor="middle" fill="#12252b" font-weight="400">拿去預測沒參與搜尋的權重</text>
<line x1="260.0" y1="657.0" x2="260.0" y2="689.0" stroke="#4b5e62" stroke-width="2" stroke-linecap="butt"/>
<polygon points="260.0,697.0 253.0,685.0 267.0,685.0" fill="#4b5e62"/>
<rect x="40.0" y="697.0" width="440" height="93.0" rx="10" fill="#fbeede" stroke="#b8651b" stroke-width="1.5"/>
<text x="260" y="737" font-size="26" text-anchor="middle" fill="#12252b" font-weight="700">在沒看過的資料上還對得上</text>
<text x="260" y="776" font-size="26" text-anchor="middle" fill="#12252b" font-weight="400">才算數，以標準差衡量</text></svg>