<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 422" width="860" height="422" role="img" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title>初始化、訓練、晶片位置三層證據的強弱</title><desc>三條由上到下的色帶：初始化有直接證據，訓練只能推論，晶片的位置與取得方式沒有證據。</desc><rect width="860" height="422" fill="#f4f6f3"/><rect x="20" y="20" width="820" height="112" rx="12" fill="#e3f0ef" stroke="none" stroke-width="1"/>
<rect x="20" y="20" width="130" height="112" rx="12" fill="#0f6b6b" stroke="none" stroke-width="1"/>
<rect x="120" y="20" width="30" height="112" rx="0" fill="#0f6b6b" stroke="none" stroke-width="1"/>
<text x="85" y="82" font-size="19" text-anchor="middle" fill="#ffffff" font-weight="700">直接證據</text>
<text x="176" y="62" font-size="19" text-anchor="start" fill="#12252b" font-weight="700">初始化：權重在哪類晶片上產生</text>
<text x="176" y="96" font-size="17" text-anchor="start" fill="#4b5e62" font-weight="400">指紋直接讀得出來</text>
<rect x="20" y="148" width="820" height="112" rx="12" fill="#fbeede" stroke="none" stroke-width="1"/>
<rect x="20" y="148" width="130" height="112" rx="12" fill="#b8651b" stroke="none" stroke-width="1"/>
<rect x="120" y="148" width="30" height="112" rx="0" fill="#b8651b" stroke="none" stroke-width="1"/>
<text x="85" y="210" font-size="19" text-anchor="middle" fill="#ffffff" font-weight="700">間接證據</text>
<text x="176" y="190" font-size="19" text-anchor="start" fill="#12252b" font-weight="700">訓練：後續跑在哪些晶片上</text>
<text x="176" y="224" font-size="17" text-anchor="start" fill="#4b5e62" font-weight="400">權重不能證明，只能推論</text>
<rect x="20" y="276" width="820" height="126" rx="12" fill="#ececec" stroke="none" stroke-width="1"/>
<rect x="20" y="276" width="130" height="126" rx="12" fill="#6b6b6b" stroke="none" stroke-width="1"/>
<rect x="120" y="276" width="30" height="126" rx="0" fill="#6b6b6b" stroke="none" stroke-width="1"/>
<text x="85" y="345" font-size="19" text-anchor="middle" fill="#ffffff" font-weight="700">沒有證據</text>
<text x="176" y="318" font-size="19" text-anchor="start" fill="#12252b" font-weight="700">晶片的位置與取得方式</text>
<text x="176" y="352" font-size="17" text-anchor="start" fill="#4b5e62" font-weight="400">租用、走私、合規</text>
<text x="176" y="378" font-size="17" text-anchor="start" fill="#4b5e62" font-weight="400">都無從判斷</text></svg>