<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 588.5" width="860" height="588.5" role="img" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><title>從公開權重還原晶片排列的流程</title><desc>已公開的權重分成沒被訓練動過的列與訓練過的權重兩類；用一部分權重搜尋種子與執行緒數，再拿同一組答案預測沒參與搜尋的權重，對得上才算數。</desc><rect width="860" height="588.5" fill="#f4f6f3"/><rect x="280.0" y="20" width="300" height="45.0" rx="10" fill="#e3f0ef" stroke="#0f6b6b" stroke-width="1.5"/>
<text x="430" y="51" font-size="17" text-anchor="middle" fill="#12252b" font-weight="700">已公開的模型權重</text>
<rect x="20" y="109.0" width="820" height="124.0" rx="14" fill="none" stroke="#c9d1cc" stroke-width="1" stroke-dasharray="6 5"/>
<rect x="40" y="123.0" width="360" height="70.5" rx="10" fill="#ffffff" stroke="#8a8173" stroke-width="1.5"/>
<text x="220" y="154" font-size="17" text-anchor="middle" fill="#12252b" font-weight="400">沒被訓練動過的列</text>
<text x="220" y="179.5" font-size="17" text-anchor="middle" fill="#12252b" font-weight="400">初始值幾乎原樣保留</text>
<rect x="460" y="123.0" width="360" height="96.0" rx="10" fill="#ffffff" stroke="#b8651b" stroke-width="1.5"/>
<text x="640" y="154" font-size="17" text-anchor="middle" fill="#12252b" font-weight="400">訓練過的權重</text>
<text x="640" y="179.5" font-size="17" text-anchor="middle" fill="#12252b" font-weight="400">初始值加上調整量，</text>
<text x="640" y="205" font-size="17" text-anchor="middle" fill="#12252b" font-weight="400">起點高的最終仍略高</text>
<line x1="430.0" y1="65.0" x2="430.0" y2="101.0" stroke="#4b5e62" stroke-width="2" stroke-linecap="butt"/>
<polygon points="430.0,109.0 423.0,97.0 437.0,97.0" fill="#4b5e62"/>
<line x1="430.0" y1="233.0" x2="430.0" y2="269.0" stroke="#4b5e62" stroke-width="2" stroke-linecap="butt"/>
<polygon points="430.0,277.0 423.0,265.0 437.0,265.0" fill="#4b5e62"/>
<rect x="280.0" y="277.0" width="300" height="70.5" rx="10" fill="#e3f0ef" stroke="#0f6b6b" stroke-width="1.5"/>
<text x="430" y="308" font-size="17" text-anchor="middle" fill="#12252b" font-weight="400">用一部分權重</text>
<text x="430" y="333.5" font-size="17" text-anchor="middle" fill="#12252b" font-weight="400">搜尋種子與執行緒數</text>
<line x1="430.0" y1="347.5" x2="430.0" y2="379.5" stroke="#4b5e62" stroke-width="2" stroke-linecap="butt"/>
<polygon points="430.0,387.5 423.0,375.5 437.0,375.5" fill="#4b5e62"/>
<rect x="280.0" y="387.5" width="300" height="70.5" rx="10" fill="#e3f0ef" stroke="#0f6b6b" stroke-width="1.5"/>
<text x="430" y="418.5" font-size="17" text-anchor="middle" fill="#12252b" font-weight="400">把同一組答案</text>
<text x="430" y="444" font-size="17" text-anchor="middle" fill="#12252b" font-weight="400">拿去預測沒參與搜尋的權重</text>
<line x1="430.0" y1="458.0" x2="430.0" y2="490.0" stroke="#4b5e62" stroke-width="2" stroke-linecap="butt"/>
<polygon points="430.0,498.0 423.0,486.0 437.0,486.0" fill="#4b5e62"/>
<rect x="280.0" y="498.0" width="300" height="70.5" rx="10" fill="#fbeede" stroke="#b8651b" stroke-width="1.5"/>
<text x="430" y="529" font-size="17" text-anchor="middle" fill="#12252b" font-weight="700">在沒看過的資料上還對得上</text>
<text x="430" y="554.5" font-size="17" text-anchor="middle" fill="#12252b" font-weight="400">才算數，以標準差衡量</text></svg>